replicaCount: 2

image:
  repository: nginx
  tag: "1.25.4"
  pullPolicy: IfNotPresent
  port: 80

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: shop.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

config:
  APP_NAME: shop-api
  LOG_LEVEL: info
  APP_ENV: prod
