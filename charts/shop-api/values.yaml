replicaCount: 3
image: { repository: docker.io/youruser/shop-api, tag: "", pullPolicy: IfNotPresent }
service: { port: 80, targetPort: 8080 }
ingress: { enabled: true, className: nginx, host: shop.local, tls: false }
resources:
requests: { cpu: 200m, memory: 384Mi }
limits: { memory: 512Mi }
autoscaling: { enabled: true, min: 3, max: 10, cpu: 60 }
config:
SPRING_PROFILES_ACTIVE: dev
DB_HOST: shop-db-postgresql
secretName: shop-db-credentials
